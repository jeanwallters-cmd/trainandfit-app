<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>אישור קודי ענן</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
</head>
<body class="min-h-screen text-slate-800 pb-20">
    <div class="max-w-md mx-auto p-4 sm:p-6">
        <div class="text-center mb-6 mt-4">
            <h1 class="text-3xl font-black text-slate-900 mb-2">אישור קודי ענן</h1>
            <p class="text-slate-500 text-sm">ניהול בקשות גישה לגיבוי בענן</p>
        </div>

        <!-- התחברות מנהל -->
        <div id="loginView" class="hidden bg-white rounded-3xl shadow-xl p-6 space-y-4 text-center">
            <div class="text-4xl">🔐</div>
            <h2 class="text-xl font-bold text-slate-900">כניסת מנהל</h2>
            <p class="text-xs text-slate-500">הכניסה מותרת רק לחשבון המנהל</p>
            <button onclick="adminGoogleLogin()" class="w-full bg-white hover:bg-slate-50 border border-slate-200 text-slate-800 font-bold py-4 rounded-2xl shadow-sm transition-all active:scale-95 flex items-center justify-center gap-3">
                <svg class="h-5 w-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
                התחבר עם Google
            </button>
            <p class="text-[11px] text-slate-400">אם החלון לא נפתח (למשל מתוך וואטסאפ) – פתח את הקישור בדפדפן Chrome / Safari.</p>
        </div>

        <!-- חשבון שאינו מנהל -->
        <div id="notAdminView" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-5 space-y-3 text-center">
            <h3 class="font-bold text-rose-800">אין הרשאת מנהל לחשבון הזה</h3>
            <p id="notAdminEmail" class="text-xs text-rose-700" dir="ltr"></p>
            <button onclick="adminLogout()" class="bg-white border border-rose-200 text-rose-700 font-bold text-xs py-2 px-4 rounded-xl">התנתק והתחבר עם חשבון אחר</button>
        </div>

        <!-- לוח מנהל -->
        <div id="adminView" class="hidden space-y-6">
            <div id="focusedRequest"></div>

            <div>
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-lg font-bold text-slate-900">בקשות ממתינות</h2>
                    <span id="adminEmail" class="text-xs text-slate-400" dir="ltr"></span>
                    <button onclick="adminLogout()" class="text-xs font-semibold text-slate-400 hover:text-slate-600">התנתק</button>
                </div>
                <div id="pendingList" class="space-y-4"></div>
            </div>

            <!-- הנפקת קוד ידנית -->
            <form onsubmit="issueManualCode(event)" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-3">
                <h2 class="text-lg font-bold text-slate-900">הנפקת קוד ידנית</h2>
                <input type="text" id="manName" required maxlength="80" placeholder="שם" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="tel" id="manPhone" required dir="ltr" maxlength="20" placeholder="05X-XXXXXXX" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-center font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="email" id="manEmail" dir="ltr" maxlength="120" placeholder="אימייל (לא חובה)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3 rounded-xl text-sm transition-all active:scale-95">הנפק קוד</button>
                <div id="manualResult"></div>
            </form>

            <div>
                <h2 class="text-lg font-bold text-slate-900 mb-3">קודים שהונפקו</h2>
                <div id="codesList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <div id="toastNotification" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-semibold py-3 px-6 rounded-2xl shadow-xl transition-all duration-300">
        <span id="toastText">הודעה</span>
    </div>

    <script type="module" src="/src/admin.js"></script>
</body>
</html>
