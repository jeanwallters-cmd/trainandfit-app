name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('2.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web app and sync to Android
        env:
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      # מפתח החתימה: קובץ מוצפן במאגר (signing/, נוצר ע"י android-keystore.yml) שנפתח בסוד
      # ANDROID_SIGNING_PASSPHRASE, או – בדרך הישנה – ארבעת סודות ANDROID_KEYSTORE_*.
      - name: Restore release keystore
        env:
          SIGNING_PASSPHRASE: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ENC=signing/trainandfit-signing.tar.gz.enc
          if [ -f "$ENC" ] && [ -n "$SIGNING_PASSPHRASE" ]; then
            DIR="$RUNNER_TEMP/signing"
            mkdir -p "$DIR"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SIGNING_PASSPHRASE -in "$ENC" \
              | tar -C "$DIR" -xzf -
            prop() { grep "^$1=" "$DIR/keystore.properties" | cut -d= -f2-; }
            STORE_PW="$(prop storePassword)"; KEY_PW="$(prop keyPassword)"
            echo "::add-mask::$STORE_PW"; echo "::add-mask::$KEY_PW"
            {
              echo "ANDROID_KEYSTORE_PATH=$DIR/trainandfit-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PW"
              echo "ANDROID_KEY_PASSWORD=$KEY_PW"
              echo "ANDROID_KEY_ALIAS=$(prop keyAlias)"
              echo "HAS_KEYSTORE=true"
            } >> "$GITHUB_ENV"
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "HAS_KEYSTORE=true"
            } >> "$GITHUB_ENV"
          else
            if [ -f "$ENC" ]; then
              echo "::error::signing/ holds the encrypted key but the ANDROID_SIGNING_PASSPHRASE secret is missing."
              exit 1
            fi
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build release-signed APK + AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/TrainAndFit-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../out/TrainAndFit-$VERSION_NAME.aab"

      - name: Build preview APK (no signing secrets yet)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          echo "::warning::Signing secrets are missing - building an APK signed with the debug key. See SETUP.md."
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/TrainAndFit-$VERSION_NAME-preview.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: trainandfit-android-${{ env.VERSION_NAME }}
          path: out/*

      # קישור הורדה קבוע: https://github.com/<owner>/<repo>/releases/tag/latest-apk
      - name: Publish latest APK
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          if [ "$HAS_KEYSTORE" = "true" ]; then
            NOTES="APK חתום (גרסה $VERSION_NAME, commit ${GITHUB_SHA::7})."
          else
            NOTES="APK תצוגה מקדימה חתום במפתח debug (גרסה $VERSION_NAME, commit ${GITHUB_SHA::7}). לחתימת release ראה SETUP.md."
          fi
          gh release create latest-apk out/*.apk --target "$GITHUB_SHA" --prerelease \
            --title "האימונים שלי – Android ($VERSION_NAME)" --notes "$NOTES"

      - name: Attach APK to version release
        if: env.HAS_KEYSTORE == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
