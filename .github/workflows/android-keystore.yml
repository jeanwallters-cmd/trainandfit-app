name: Android signing key (one-time)

# מייצר פעם אחת את מפתח החתימה הקבוע של Android ושומר אותו ישירות ב-GitHub Secrets.
# המאגר ציבורי, ולכן המפתח לא מודפס ללוג ולא מועלה כקובץ גלוי – רק גיבוי מוצפן.
# דרוש לפני ההרצה (ראה SETUP.md, סעיף 6):
#   SECRETS_ADMIN_TOKEN        – Fine-grained token עם הרשאת Secrets: Read and write למאגר הזה
#   KEYSTORE_BACKUP_PASSPHRASE – סיסמה ארוכה שתבחר; מצפינה את קובץ הגיבוי
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_ADMIN_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN != '' }}
      HAS_PASSPHRASE: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE != '' }}
    steps:
      - name: Check prerequisites
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 already exists. Replacing the signing key would break updates for every installed copy - refusing."
            exit 1
          fi
          if [ "$HAS_ADMIN_TOKEN" != "true" ] || [ "$HAS_PASSPHRASE" != "true" ]; then
            echo "::error::Add the SECRETS_ADMIN_TOKEN and KEYSTORE_BACKUP_PASSPHRASE secrets first (SETUP.md, section 6)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore and store it as repository secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
          ALIAS: trainandfit
        run: |
          set -euo pipefail
          umask 077
          WORK="$RUNNER_TEMP/signing"
          mkdir -p "$WORK"
          PASSWORD="$(openssl rand -base64 24 | tr -d '/+=')"
          echo "::add-mask::$PASSWORD"

          keytool -genkeypair \
            -keystore "$WORK/trainandfit-release.jks" -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=TrainAndFit, O=TrainAndFit, C=IL" >/dev/null 2>&1

          base64 -w0 "$WORK/trainandfit-release.jks" | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$PASSWORD" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf '%s' "$PASSWORD" | gh secret set ANDROID_KEY_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf '%s' "$ALIAS" | gh secret set ANDROID_KEY_ALIAS --repo "$GITHUB_REPOSITORY"

          # גיבוי: ה-keystore והסיסמה, מוצפנים ב-AES-256 עם הסיסמה שבחרת
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$PASSWORD" "$PASSWORD" "$ALIAS" > "$WORK/keystore.properties"
          mkdir -p "$RUNNER_TEMP/backup"
          tar -C "$WORK" -czf - trainandfit-release.jks keystore.properties \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE \
              -out "$RUNNER_TEMP/backup/trainandfit-signing-backup.tar.gz.enc"
          rm -rf "$WORK"
          echo "Signing key created and saved to the repository secrets."

      - uses: actions/upload-artifact@v4
        with:
          name: trainandfit-signing-backup-ENCRYPTED
          path: ${{ runner.temp }}/backup/trainandfit-signing-backup.tar.gz.enc
          retention-days: 90
