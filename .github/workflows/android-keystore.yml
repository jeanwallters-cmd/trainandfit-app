name: Android signing key (one-time)

# מייצר פעם אחת את מפתח החתימה הקבוע של Android, מצפין אותו ב-AES-256 עם הסוד
# ANDROID_SIGNING_PASSPHRASE ושומר את הקובץ המוצפן במאגר (signing/). הקובץ הוא גם הגיבוי.
# המאגר ציבורי: המפתח עצמו לא מודפס ולא נשמר גלוי בשום מקום. ראה SETUP.md, סעיף 6.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        env:
          SIGNING_PASSPHRASE: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
        run: |
          if [ -e signing/trainandfit-signing.tar.gz.enc ]; then
            echo "::error::A signing key already exists in signing/. Replacing it would break updates for every installed copy - refusing."
            exit 1
          fi
          if [ "${#SIGNING_PASSPHRASE}" -lt 20 ]; then
            echo "::error::Add the ANDROID_SIGNING_PASSPHRASE secret first: a random password of at least 20 characters (SETUP.md, section 6)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate and encrypt the keystore
        env:
          SIGNING_PASSPHRASE: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
          ALIAS: trainandfit
        run: |
          set -euo pipefail
          umask 077
          WORK="$RUNNER_TEMP/signing"
          mkdir -p "$WORK" signing
          PASSWORD="$(openssl rand -base64 24 | tr -d '/+=')"
          echo "::add-mask::$PASSWORD"

          keytool -genkeypair \
            -keystore "$WORK/trainandfit-release.jks" -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=TrainAndFit, O=TrainAndFit, C=IL" >/dev/null 2>&1
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$PASSWORD" "$PASSWORD" "$ALIAS" > "$WORK/keystore.properties"

          tar -C "$WORK" -czf - trainandfit-release.jks keystore.properties \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:SIGNING_PASSPHRASE \
              -out signing/trainandfit-signing.tar.gz.enc

          # בדיקה שהקובץ נפתח עם הסיסמה לפני השמירה
          CHECK="$RUNNER_TEMP/check"; mkdir -p "$CHECK"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SIGNING_PASSPHRASE \
            -in signing/trainandfit-signing.tar.gz.enc | tar -C "$CHECK" -xzf -
          keytool -list -keystore "$CHECK/trainandfit-release.jks" -storepass "$PASSWORD" -alias "$ALIAS" >/dev/null
          keytool -list -v -keystore "$CHECK/trainandfit-release.jks" -storepass "$PASSWORD" -alias "$ALIAS" | grep 'SHA256:'
          rm -rf "$WORK" "$CHECK"

      - name: Save the encrypted key to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/trainandfit-signing.tar.gz.enc
          git commit -m "Add the encrypted Android signing key [skip ci]"
          git push
